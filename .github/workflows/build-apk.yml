name: Build Typo Keyboard APK

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore the updated keyboard source
        run: |
          cat .build-source/part-*.b64 | base64 --decode | tar -xz
          base64 --decode .build-source/patch-service.b64 | tar -xj
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "if (!releaseKeystorePropertiesFile.exists()) {",
              "def releaseBuildRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }\nif (releaseBuildRequested && !releaseKeystorePropertiesFile.exists()) {",
              1
          )
          s = s.replace(
              "}\nreleaseKeystorePropertiesFile.withInputStream { releaseKeystoreProperties.load(it) }",
              "}\nif (releaseKeystorePropertiesFile.exists()) {\n    releaseKeystorePropertiesFile.withInputStream { releaseKeystoreProperties.load(it) }\n}",
              1
          )
          s = re.sub(
              r"        release \{\n            storeFile file\(releaseKeystoreProperties\.getProperty\('storeFile'\)\)\n            storePassword releaseKeystoreProperties\.getProperty\('storePassword'\)\n            keyAlias releaseKeystoreProperties\.getProperty\('keyAlias'\)\n            keyPassword releaseKeystoreProperties\.getProperty\('keyPassword'\)\n        \}",
              "        release {\n            if (releaseKeystorePropertiesFile.exists()) {\n                storeFile file(releaseKeystoreProperties.getProperty('storeFile'))\n                storePassword releaseKeystoreProperties.getProperty('storePassword')\n                keyAlias releaseKeystoreProperties.getProperty('keyAlias')\n                keyPassword releaseKeystoreProperties.getProperty('keyPassword')\n            }\n        }",
              s,
              count=1
          )
          s = s.replace(
              "        release {\n            signingConfig signingConfigs.release\n        }",
              "        release {\n            if (releaseKeystorePropertiesFile.exists()) {\n                signingConfig signingConfigs.release\n            }\n        }",
              1
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Typo-shift-full-width-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare private release signing key
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          TYPO_KEYSTORE_BASE64: ${{ secrets.TYPO_KEYSTORE_BASE64 }}
          TYPO_STORE_PASSWORD: ${{ secrets.TYPO_STORE_PASSWORD }}
          TYPO_KEY_ALIAS: ${{ secrets.TYPO_KEY_ALIAS }}
          TYPO_KEY_PASSWORD: ${{ secrets.TYPO_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          names = ["TYPO_KEYSTORE_BASE64", "TYPO_STORE_PASSWORD", "TYPO_KEY_ALIAS", "TYPO_KEY_PASSWORD"]
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          key_path = Path(os.environ["RUNNER_TEMP"]) / "typo-release-key.jks"
          try:
              key_bytes = base64.b64decode(os.environ["TYPO_KEYSTORE_BASE64"], validate=True)
          except Exception as exc:
              raise SystemExit("TYPO_KEYSTORE_BASE64 is not valid Base64") from exc
          if not key_bytes:
              raise SystemExit("Decoded keystore is empty")
          key_path.write_bytes(key_bytes)
          import hashlib
          print("Keystore SHA256: " + hashlib.sha256(key_bytes).hexdigest())
          def escape_property(value):
              value = value.replace("\\", "\\\\").replace("\t", "\\t").replace("\n", "\\n").replace("\r", "\\r")
              value = value.replace(":", "\\:").replace("=", "\\=")
              if value.startswith(" "):
                  value = "\\ " + value[1:]
              return value
          props = {
              "storeFile": str(key_path),
              "storePassword": os.environ["TYPO_STORE_PASSWORD"],
              "keyAlias": os.environ["TYPO_KEY_ALIAS"],
              "keyPassword": os.environ["TYPO_KEY_PASSWORD"],
          }
          Path("keystore.properties").write_text(
              "".join(f"{k}={escape_property(v)}\n" for k, v in props.items()),
              encoding="ISO-8859-1"
          )
          print("Private signing material prepared on the temporary runner.")
          Path("app/keystore.properties").write_text(Path("keystore.properties").read_text(encoding="ISO-8859-1"), encoding="ISO-8859-1")
          Path("app/keystore.properties").write_text(Path("keystore.properties").read_text(encoding="ISO-8859-1"), encoding="ISO-8859-1")
          PY

      - name: Validate keystore password
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          TYPO_STORE_PASSWORD: ${{ secrets.TYPO_STORE_PASSWORD }}
          TYPO_KEY_ALIAS: ${{ secrets.TYPO_KEY_ALIAS }}
        run: |
          echo "TYPO_STORE_PASSWORD length: ${#TYPO_STORE_PASSWORD}"
          keytool -list -keystore "$RUNNER_TEMP/typo-release-key.jks" -storepass "$TYPO_STORE_PASSWORD" -alias "$TYPO_KEY_ALIAS"
          echo "Keystore password and alias validated."

      - name: Build signed release APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: gradle --no-daemon assembleRelease

      - name: Verify release APK signature
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Typo-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
