plugins { id 'com.android.application' }

android {
    namespace 'com.amin.keyboard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amin.keyboard'
        minSdk 23
        targetSdk 35
        versionCode 101
        versionName '1.0.1-test'
    }

    buildTypes {
        debug {
            // Keep the test APK side-by-side with the installed signed release.
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
